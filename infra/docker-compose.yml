# Base: backend + Redis + Postgres. Identico entre Hostinger e ZimaOS/CasaOS
# — so o roteamento HTTP externo muda (ver docker-compose.hostinger.yml e
# docker-compose.casaos.yml, e docs/deployment.md).
#
# Os tetos de memoria existem pra que um flood (ver docs/security.md) derrube
# no maximo o Rolaí, nunca o host inteiro.
services:
  backend:
    build:
      context: ../services/backend
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+asyncpg://rolai:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/rolai
      # Sem proxy na frente, X-Forwarded-For e forjavel e nao deve ser usado
      # pro limite por IP. O override de Hostinger liga isto (Traefik).
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5273"]}'
      # Limites de abuso — repassados do .env (ver .env.example). Os defaults
      # abaixo espelham services/backend/app/config.py (fonte de verdade);
      # 0 desliga o limite correspondente.
      HTTP_RATE_LIMIT_PER_MINUTE: "${HTTP_RATE_LIMIT_PER_MINUTE:-120}"
      ROOM_CREATE_LIMIT_PER_HOUR: "${ROOM_CREATE_LIMIT_PER_HOUR:-30}"
      PROFILE_CREATE_LIMIT_PER_HOUR: "${PROFILE_CREATE_LIMIT_PER_HOUR:-10}"
      WS_CONNECT_LIMIT_PER_MINUTE: "${WS_CONNECT_LIMIT_PER_MINUTE:-30}"
      MAX_MEMBERS_PER_ROOM: "${MAX_MEMBERS_PER_ROOM:-20}"
      MAX_SPECTATORS_PER_ROOM: "${MAX_SPECTATORS_PER_ROOM:-5}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-65536}"
      MAX_ACTIVE_ROOMS: "${MAX_ACTIVE_ROOMS:-1000}"
      PROFILE_TTL_DAYS: "${PROFILE_TTL_DAYS:-30}"
      PROFILE_PURGE_INTERVAL_SECONDS: "${PROFILE_PURGE_INTERVAL_SECONDS:-86400}"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Estado de sala e efemero (TTL de horas). Com teto de memoria + despejo
    # LRU, uma enxurrada de salas para de crescer em vez de comer a RAM do
    # host ate o OOM killer aparecer.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    mem_limit: 320m

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rolai
      # Sem default: senha fraca em producao vaza facil demais.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: rolai
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m

volumes:
  redis-data:
  postgres-data:
