# Override para Hostinger. Ver docs/deployment.md.
#
# O Traefik do VPS roda em **rede host** (nao numa bridge compartilhada):
# `--providers.docker=true --providers.docker.exposedbydefault=false`, com
# entrypoints web(:80) e websecure(:443) e redirect global web -> websecure.
# Em modo host ele alcanca o IP de bridge de qualquer container do host, entao
# NAO existe (nem e preciso) uma rede externa comum — cada app fica na propria
# rede default do seu compose, que e o padrao dos outros servicos do VPS
# (save-state, whishper, hermes-webui). Por isso este arquivo nao declara
# `networks`: so anexa labels.
#
# Tambem nao ha routers de porta 80 aqui: o proprio Traefik ja redireciona
# web -> websecure no nivel do entrypoint, o que cobre `.app` (HSTS preload) e
# qualquer cliente que ainda tente http.
services:
  backend:
    environment:
      # Traefik na frente: o IP real do cliente chega em X-Forwarded-For, e
      # so aqui da pra confiar nesse header (docs/security.md).
      TRUST_PROXY_HEADERS: "true"
    labels:
      # exposedbydefault=false no provider: sem esta linha o Traefik ignora.
      - "traefik.enable=true"
      - "traefik.http.routers.rolai-backend.rule=Host(`${ROLAI_BACKEND_HOST}`)"
      - "traefik.http.routers.rolai-backend.entrypoints=websecure"
      - "traefik.http.routers.rolai-backend.tls.certresolver=${LETSENCRYPT_RESOLVER}"
      - "traefik.http.services.rolai-backend.loadbalancer.server.port=8000"
      # Primeira barreira de flood, antes de chegar na app: media de 20 req/s
      # por IP com rajada de 50. O limite fino (criar sala, abrir WS, gente
      # por sala) fica no backend — ver docs/security.md.
      - "traefik.http.middlewares.rolai-ratelimit.rateLimit.average=20"
      - "traefik.http.middlewares.rolai-ratelimit.rateLimit.burst=50"
      # MODO LARANJA ATIVO (docs/security-cloudflare.md): com a Cloudflare no
      # caminho, o IP do cliente vem no CF-Connecting-IP — depth=1 pegaria o
      # IP da borda da CF e agruparia todo mundo errado.
      #- "traefik.http.middlewares.rolai-ratelimit.rateLimit.sourceCriterion.ipStrategy.depth=1"
      - "traefik.http.middlewares.rolai-ratelimit.rateLimit.sourceCriterion.requestHeaderName=CF-Connecting-IP"
      # Bypass direto ao VPS fechado POR ROUTER (este VPS hospeda outros
      # sites fora da CF — firewall global em 80/443 derrubaria eles): so
      # trafego vindo dos ranges da Cloudflare chega nos routers do rolai.
      # Lista: https://www.cloudflare.com/ips/ (muda raramente; revisitar).
      - "traefik.http.middlewares.rolai-cfonly.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
      # Corpo grande morre no proxy, nao na app.
      - "traefik.http.middlewares.rolai-buffer.buffering.maxRequestBodyBytes=131072"
      - "traefik.http.middlewares.rolai-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.rolai-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.rolai-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.rolai-headers.headers.frameDeny=true"
      - "traefik.http.routers.rolai-backend.middlewares=rolai-ratelimit,rolai-buffer,rolai-headers,rolai-cfonly"

  web:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rolai-web.rule=Host(`${ROLAI_WEB_HOST}`)"
      - "traefik.http.routers.rolai-web.entrypoints=websecure"
      - "traefik.http.routers.rolai-web.tls.certresolver=${LETSENCRYPT_RESOLVER}"
      - "traefik.http.services.rolai-web.loadbalancer.server.port=80"
      - "traefik.http.routers.rolai-web.middlewares=rolai-headers,rolai-cfonly"
