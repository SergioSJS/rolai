# Serve a PWA. Duas coisas importam aqui:
#  - SPA fallback: qualquer rota cai no index.html (o app le ?room= e
#    ?stream= da URL);
#  - o service worker NAO pode ser cacheado, senao o navegador fica preso
#    numa versao antiga do app depois de um deploy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # config.js e escrito pelo entrypoint a cada start (URL do backend vinda
    # da env). Nao pode ser cacheado por NINGUEM: sem Cache-Control explicito
    # o navegador cacheia por heuristica e uma CDN na frente trata .js como
    # estatico por padrao — trocar o dominio no .env deixaria de fazer efeito
    # sem ninguem entender por que.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Assets tem hash no nome — cache longo e seguro. Um unico Cache-Control:
    # `expires` ja emite o seu, e a resposta saia com DOIS headers, deixando
    # a escolha pro cliente/CDN.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Digital Asset Links: e o que autoriza a TWA a abrir em tela cheia
    # (apps/android/README.md). Fica FORA do fallback de SPA de proposito —
    # se o arquivo sumir do build, tem que dar 404, nao 200 com o HTML do
    # app. O Android so aceita application/json, e um index.html devolvido
    # com status 200 vira um "nao funciona e nao diz por que".
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
