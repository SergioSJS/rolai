# Serve a PWA. Duas coisas importam aqui:
#  - SPA fallback: qualquer rota cai no index.html (o app le ?room= e
#    ?stream= da URL);
#  - o service worker NAO pode ser cacheado, senao o navegador fica preso
#    numa versao antiga do app depois de um deploy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Assets tem hash no nome — cache longo e seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
