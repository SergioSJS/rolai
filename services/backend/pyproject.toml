[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "rolai-backend"
version = "1.1.1"
description = "Relay de sala do rolai. Nao valida rolagens, so retransmite (ver docs/security.md)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # `pytest --cov=app`. Local, nao no CI — ver docs/manual-test-checklist.md.
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
# `pip install .` (o caminho do CI) deixa uma copia do pacote em build/lib,
# e o mypy reclama de modulo "app" duplicado. Localmente nao aparece porque
# usamos uv, que nao gera esse diretorio.
exclude = ["^build/"]
