name: Release

# Gera o APK e anexa numa Release do GitHub — e assim que o app e
# distribuido (nao vai pra Play Store). Dispara em tag `v*` ou na mao.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # A chave de assinatura e OPCIONAL. Com os secrets presentes sai um APK
      # de release assinado por uma chave estavel — requisito do assetlinks e,
      # portanto, da TWA abrir em tela cheia (apps/android/README.md). Sem os
      # secrets cai no APK de debug, que instala igual e so nao valida o
      # dominio. A chave privada nunca entra no git: chega em base64 pelo
      # secret e vive so no runner, que e descartado no fim.
      - name: Preparar keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Sem ANDROID_KEYSTORE_BASE64 — sai APK de debug."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rolai.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/rolai.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Renomear com a versao
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            src=apps/android/app/build/outputs/apk/release/app-release.apk
          else
            src=apps/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$src" "rolai-$version.apk"
          echo "path=rolai-$version.apk" >> "$GITHUB_OUTPUT"

      # Impressao digital do APK publicado: e o valor que precisa estar no
      # assetlinks.json de rolai.app. Conferir aqui evita o caso "instalei e
      # abriu com barra de URL" sem explicacao.
      - name: Mostrar fingerprint do APK
        run: |
          sdk=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$sdk/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}" \
            | grep -i "SHA-256" || true

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          # workflow_dispatch nao tem tag: cria/atualiza a "nightly".
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Build mais recente' }}
          prerelease: ${{ github.ref_type != 'tag' }}
